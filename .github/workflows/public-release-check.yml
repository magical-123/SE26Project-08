name: Public release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-current-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tracked release files
        run: python scripts/check_public_release.py
