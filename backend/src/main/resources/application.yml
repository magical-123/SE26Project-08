spring:
  application:
    name: infodigest-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
  credentials:
    encryption-key: ${CREDENTIAL_ENCRYPTION_KEY}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,chrome-extension://*,edge-extension://*}

logging:
  level:
    com.infodigest: INFO
    org.springframework.security: INFO

# AI 摘要配置（每条数据入库时异步触发，无需定时调度）
ai:
  deepseek:
    api-url: https://api.deepseek.com/v1/chat/completions
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
