spring:
  application:
    name: infodigest-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/info_digest?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: REPLACE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    com.infodigest: INFO
    org.springframework.security: INFO

# AI 摘要配置（每条数据入库时异步触发，无需定时调度）
ai:
  deepseek:
    api-url: https://api.deepseek.com/v1/chat/completions
    api-key: ${DEEPSEEK_API_KEY:sk-your-api-key}
    model: deepseek-v4-flash
