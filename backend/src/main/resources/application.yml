spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: infodigest-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

security:
  jwt:
    secret: ${JWT_SECRET}
  credentials:
    encryption-key: ${CREDENTIAL_ENCRYPTION_KEY}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,chrome-extension://*,edge-extension://*}

logging:
  level:
    com.infodigest: INFO
    org.springframework.security: INFO

# AI 摘要配置（每条数据入库时异步触发，无需定时调度）
ai:
  deepseek:
    api-url: https://api.deepseek.com/v1/chat/completions
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash

# 爬虫微服务配置
crawler:
  api:
    url: ${CRAWLER_SERVICE_URL:http://localhost:3000/crawl}
