spring:
  application:
    name: infodigest-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/info_digest?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: REPLACE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    com.infodigest: INFO
    org.springframework.security: INFO

# AI 摘要配置
ai:
  deepseek:
    api-url: https://api.deepseek.com/v1/chat/completions
    api-key: ${DEEPSEEK_API_KEY:sk-your-api-key}
    model: deepseek-chat
    # 每轮处理的条数
    batch-size: 5
    # 两次轮询间隔（毫秒，默认2分钟）
    poll-interval-ms: 120000
