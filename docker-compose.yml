
services:
  backend:
    # 替换为从 GHCR 拉取
    image: ghcr.io/magical-123/se26project-08-backend:latest
    container_name: infodigest-backend
    restart: always
    environment:
      - TZ=Asia/Shanghai
      # 请在 .env 中填入宿主机的内网 IP 以连接原生数据库和缓存
      - DB_URL=${DB_URL:?Set DB_URL in your private .env}
      - DB_USERNAME=${DB_USERNAME:?Set DB_USERNAME in your private .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in your private .env}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-10}
      - DB_POOL_MIN_IDLE=${DB_POOL_MIN_IDLE:-2}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your private .env}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in your private .env}
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:?Set CORS_ALLOWED_ORIGIN_PATTERNS in your private .env}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:?Set REDIS_HOST in your private .env}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CRAWLER_SERVICE_URL=${CRAWLER_SERVICE_URL:-http://crawler:3000/crawl}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - crawler

  frontend:
    # 从 GitHub 的官方镜像仓库直接拉取
    image: ghcr.io/magical-123/se26project-08-frontend:latest
    container_name: infodigest-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  crawler:
    image: ghcr.io/magical-123/se26project-08-crawler:latest
    container_name: infodigest-crawler
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - BACKEND_URL=http://backend:8080

  # 看门狗：每隔 5 分钟自动检查是否有新镜像，自动拉取重启
  watchtower:
    profiles: ["auto-update"]
    image: ghcr.io/containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 300 infodigest-backend infodigest-frontend infodigest-crawler --cleanup
